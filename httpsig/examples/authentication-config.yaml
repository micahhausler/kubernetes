# An HTTP message signature authenticator, showing both ways of resolving a
# signature to an identity. Pass this to kube-apiserver as --authentication-config, with
# --feature-gates=HTTPSignatureAuthentication=true.
#
# This file is validated on every run of the httpsig test suite, using the same
# decode and validation kube-apiserver performs at startup. It is a reference to
# copy from rather than a file to deploy: the key material in it is inert, as noted
# where it appears.
apiVersion: apiserver.config.k8s.io/v1
kind: AuthenticationConfiguration
httpSignature:
  # The external authority and scheme clients sign, for a server behind a
  # TLS-terminating proxy that rewrites Host. Omit both when clients reach the API
  # server directly, which is when the connection's own values are correct.
  #
  # These sit on the section rather than on an authenticator because a request's
  # signatures are parsed once, before any authenticator has been selected. The
  # Forwarded and X-Forwarded-* fields are never consulted: they are unsigned input,
  # and the point of signing @authority is that a signature cannot be replayed
  # against a different server.
  #
  # authority: kubernetes.example.com
  # scheme: https

  authenticators:

  # Resolution by resolver process. No key and no identity appears in this file: the
  # resolver on the socket below answers, for a keyID, which key verifies signatures
  # bearing it and whose identity that is. It also records the nonce of every
  # accepted signature, which is what closes replay across more than one API server.
  #
  # The protocol is k8s.io/externalhttpsig. The API server does all of the
  # cryptography and holds no key for longer than the cache below allows; the
  # resolver holds key material and never sees a request.
  - name: corp-resolver
    # A Unix domain socket, or unix://@name for a Linux abstract socket. The
    # connection carries no TLS and this server does not authenticate the resolver,
    # so access to the socket is the whole trust boundary: whoever can serve on it
    # can vend an identity to this cluster.
    endpoint: unix:///var/run/httpsig/resolver.sock
    # How old a signature may be, measured from its created parameter. With a
    # resolver recording nonces this is not the replay window; it bounds how stale a
    # request may be, and so how long the resolver is asked to remember a nonce.
    maxAge: 1m
    # Added to time comparisons for clock skew, and widens the accepted window by the
    # same amount. Omit it unless skew is a demonstrated problem.
    # tolerance: 5s
    # Only keyIDs whose first segment matches reach this resolver. Omitting this
    # means it is asked about every keyID, which for a keyID nobody serves costs one
    # call driven by a caller who has authenticated nothing. At most one
    # authenticator may omit it.
    #
    # A keyID beginning "x509-sha256:" never reaches a resolver whatever this says:
    # that form is reserved for signatures whose key a certificate asserts, so which
    # authenticator answers such a signature does not depend on list order.
    keyIDPrefixes: [corp]
    # Header values sent to the resolver with a lookup, for a resolver that decides
    # identity from a rotating session token rather than from a keyID. Nothing else
    # about the request is sent. A named header present but not covered by the
    # signature rejects the request before any lookup, so an intermediary cannot
    # inject one.
    # relayedHeaders: [X-Session-Token]
    # Whether the resolver is asked to record each accepted signature's nonce.
    # Consume is the default. Ignore turns replay protection off and makes the replay
    # window maxAge plus tolerance, during which a captured request can be replayed
    # against every API server without limit; it exists for a resolver with no nonce
    # store, so that the absence is stated here rather than faked by a resolver that
    # always answers yes.
    # nonceHandling: Consume
    cache:
      # How long a resolved key is reused, capping what the resolver asks for. A
      # cached key outlives its revocation, so this is the revocation window.
      maxAge: 5m
      # How long this server remembers that a resolver does not serve a keyID. A
      # resolver cannot state this itself, because not-found is a status rather than
      # an answer with fields.
      negativeMaxAge: 10s
      # Entries in each of the two caches kept per resolver, resolved keys and
      # unserved keyIDs. The two are separate so a flood of unknown keyIDs cannot
      # evict working keys.
      maxKeys: 1024

  # Resolution by certificate. The server holds the authority below and nothing per
  # client: the identity comes from the certificate the request carries. Adding a
  # client is issuing a certificate, and a certificate's lifetime is the withdrawal
  # window, because there is no per-client state here to delete.
  #
  # Unlike the resolver above, nothing here records nonces: there is no store every
  # API server shares. maxAge plus tolerance is therefore the whole replay window for
  # a certificate, and nonceHandling is refused on this authenticator rather than
  # accepted and ignored.
  #
  # This is mutual TLS with the handshake replaced by a message signature. The same
  # authority, the same issuance, and the same subject conventions apply; only the
  # point of authentication moves into the message, which is what lets it survive a
  # TLS-terminating hop.
  - name: workload-certificates
    maxAge: 1m
    x509:
      # Issue an authority for this purpose and put only that one here.
      #
      # Extended key usage is not checked, so this bundle is the only thing saying
      # who is enlisted. No registered usage means "may sign detached HTTP
      # messages": requiring clientAuth would make every certificate issued for
      # connection authentication a signing credential, and requiring a new usage
      # would mean reissuing for everyone.
      #
      # The failure to avoid: putting an organization's general-purpose internal
      # authority here, because that is the authority to hand. Every certificate it
      # has ever issued then authenticates to this API server, and with the mapping
      # below, whoever can request one chooses the identity they get.
      #
      # The private key of this example authority was destroyed when it was
      # generated. It can issue nothing.
      certificateAuthority: |
        -----BEGIN CERTIFICATE-----
        MIIBuDCCAV2gAwIBAgIUDdoSV3eINMqiAGTtL0gyi9zgCmwwCgYIKoZIzj0EAwIw
        KTEnMCUGA1UEAwweZXhhbXBsZS1hdXRob3JpdHktZG8tbm90LXRydXN0MB4XDTI2
        MDgxOTE4NDYwMVoXDTM2MDgxNjE4NDYwMVowKTEnMCUGA1UEAwweZXhhbXBsZS1h
        dXRob3JpdHktZG8tbm90LXRydXN0MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE
        G85ujx1gMLkg69exKVFR8BIqv9+Ob4tmvXMllNCoKBFTmoihUanWdSQly/H5JO66
        VAGKNj3N1plaL1GsmJmDiqNjMGEwHQYDVR0OBBYEFJlL2DyESsU2JU3X0vFM16Nh
        5rZGMB8GA1UdIwQYMBaAFJlL2DyESsU2JU3X0vFM16Nh5rZGMA8GA1UdEwEB/wQF
        MAMBAf8wDgYDVR0PAQH/BAQDAgKEMAoGCCqGSM49BAMCA0kAMEYCIQDH1eAL0/O9
        Y7b7iGV2Xv84jcG9W8BZ7R+g3jroRvjf/QIhAI/ch/8OQT1ZYdKjFPLvR8xfHxy0
        BWl9QP4k28JU+IWm
        -----END CERTIFICATE-----
      certificateCache:
        # How long a successful validation is trusted, which is also the window in
        # which withdrawing a certificate has no effect. Clamped internally to the
        # remaining life of every certificate in the validated chain, so this can
        # never outlive the authority that vouched for it.
        ttl: 5m
        # Validated certificates remembered at once. Entries are created only on
        # success, so occupying one requires a certificate this authority issued.
        maxEntries: 1024

    # Run before claimMappings, so a mapping never reads a certificate no rule has
    # vetted.
    certificateValidationRules:
    # A certificate's lifetime is the withdrawal window, and this is the only lever
    # the verifier has over it. There is no dedicated field for this because
    # subtracting the validity bounds is the general form.
    - expression: cert.notAfter - cert.notBefore <= duration('24h')
      message: 'certificate lifetime must not exceed 24 hours'

    # Where the identity comes from. Available on the cert variable: subject and
    # issuer, each with commonName, organization and organizationalUnit;
    # serialNumber; notBefore and notAfter; dnsSANs, uriSANs, emailSANs and ipSANs;
    # sha256Thumbprint; and extendedKeyUsages.
    #
    # Test a multi-valued attribute with exists() and never by position. A
    # multi-valued name attribute is an ASN.1 SET, canonically ordered by encoding,
    # so the order the issuer supplied is not the order read back.
    claimMappings:
      # A URI SAN is where workload identity schemes put their identifier, which
      # makes it the field that interoperates. A literal prefix keeps these names
      # from colliding with those another authenticator issues.
      username:
        expression: '"spiffe:" + cert.uriSANs[0]'
      groups:
        expression: cert.subject.organization
      # The digest the signature's keyid carries, so the identity names one exact
      # certificate rather than anything its issuer could reuse.
      uid:
        expression: cert.sha256Thumbprint
      extra:
      - key: httpsig.example.com/issuer
        valueExpression: cert.issuer.commonName

    # What an assertion claims is a claim, not a conclusion. These rules are the
    # cluster's only say over what the authority above may mint.
    #
    # Keep this rule unless the deployment means otherwise. The groups mapping
    # derives from the certificate's subject, which hands the choice of group to
    # whoever can request a certificate: without this, a requester naming
    # system:masters in their organization receives cluster administrator.
    #
    # Relaxing it is a deliberate decision. Mapping a node's certificate to
    # system:node:<name> means the node authorizer and the NodeRestriction admission
    # plugin now trust this authority.
    userValidationRules:
    - expression: '!user.username.startsWith("system:") && !user.groups.exists(g, g.startsWith("system:"))'
      message: 'this authenticator may not assert an identity under the system: prefix'
