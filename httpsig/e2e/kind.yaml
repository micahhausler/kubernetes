# Written for kind v0.32.0 and a source build of this branch (Kubernetes 1.37).
#
# up.sh renders this into fixtures/kind.yaml, substituting the cluster name and
# node image from env.sh, and hands kind the rendered copy. The values below are
# the defaults for a branch named httpsig, so this file is still directly usable
# with `kind create cluster --config kind.yaml`. Relative paths in extraMounts
# resolve against the working directory rather than this file, so the rendered
# copy under fixtures/ reads the same mount.
apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
name: httpsig
nodes:
- role: control-plane
  # Naming the image here rather than relying on a --image flag. Without it kind
  # uses its own default node image, which is an older Kubernetes that has never
  # heard of any of this, and the failure is indirect: the kubelet panics on the
  # unrecognized feature gate, no static pods are created, and kubeadm reports a
  # connection refused from an API server that was never started.
  #
  # This tag and the cluster name above are defaults. env.sh derives both from the
  # current branch and up.sh substitutes them, because a node image tag is a Docker
  # tag and therefore global to the machine: two branches sharing one means
  # whichever built last decides which API server a cluster runs, and that failure
  # is silent.
  image: kindest/node:httpsig-dev
  # A JSON patch rather than a strategic merge patch, because in kubeadm v1beta4
  # extraArgs is a list of name/value pairs with no merge key. A merge patch would
  # replace the list and drop the runtime-config argument kind puts there.
  #
  # The feature gate goes here rather than in kind's top-level featureGates,
  # which would also hand it to the kubelet, the scheduler, the controller
  # manager, and kube-proxy. This gate is read only by the API server, and a
  # component that does not recognize a gate name does not ignore it, it refuses
  # to start.
  kubeadmConfigPatchesJSON6902:
  - group: kubeadm.k8s.io
    version: v1beta4
    kind: ClusterConfiguration
    patch: |
      - op: add
        path: /apiServer/extraArgs/-
        value:
          name: feature-gates
          value: HTTPSignatureAuthentication=true
      - op: add
        path: /apiServer/extraArgs/-
        value:
          name: authentication-config
          value: /httpsig/authentication-config.yaml
      - op: add
        path: /apiServer/extraVolumes
        value:
        - name: httpsig
          hostPath: /httpsig
          mountPath: /httpsig
          readOnly: true
        # The resolver's socket. Read only, which still permits connect: connecting
        # to a unix socket is a permission check on the inode, not a write to the
        # filesystem. So the API server can reach the resolver and cannot replace
        # it with a listener of its own.
        - name: httpsig-socket
          hostPath: /httpsig-socket
          mountPath: /httpsig-socket
          readOnly: true
  # Resolved against the working directory, so run kind from this directory.
  extraMounts:
  # The node's whole view of the configuration. After the move to a resolver this
  # holds no key material at all: one authentication configuration naming a socket.
  # Compare fixtures/resolver, which holds the keys and is mounted nowhere.
  - hostPath: ./fixtures/node
    containerPath: /httpsig
    readOnly: true
  # The directory the resolver's socket lives in. The resolver runs on the host and
  # creates the socket there; the node only connects to it.
  #
  # Read only here too. A socket is reachable through a read-only mount, so the
  # weaker mount costs nothing and means nothing in the node can unlink the socket
  # and take the resolver's place.
  - hostPath: ./fixtures/socket
    containerPath: /httpsig-socket
    readOnly: true
